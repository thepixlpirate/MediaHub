function stt(t){const s=t.state;if(/error|missingFiles/.test(s))return["Error","r"];if(/^(paused|stopped)/.test(s))return[t.progress>=1?"Completed":"Paused",""];if(/^queued/.test(s))return["Queued",""];
if(/^checking/.test(s)||s=="allocating")return["Checking","o"];if(s=="moving")return["Moving","o"];if(s=="stalledDL")return["Stalled","o"];if(s=="stalledUP")return["Seeding","g"];
if(s=="uploading"||s=="forcedUP")return[s=="forcedUP"?"Forced seeding":"Seeding","g"];if(s=="metaDL"||s=="forcedMetaDL")return["Metadata","a"];if(s=="forcedDL")return["Forced","a"];if(s=="downloading")return["Downloading","a"];return[s,""]}
const FILT=[["all","All",t=>1],["downloading","Downloading",t=>DLST.includes(t.state)],["seeding","Seeding",t=>ULST.includes(t.state)],["completed","Completed",t=>t.progress>=1],["paused","Paused",t=>/^(paused|stopped)/.test(t.state)],

$("srb").innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="f" id="sq" style="margin:0;flex:2;min-width:200px" placeholder="What are you looking for?" onkeydown="if(event.key=='Enter')sGo()" value="${esc(SJ?.pattern||"")}">${sel("scat",[...cats],SCAT,'style="margin:0;flex:1;min-width:140px" onchange="SCAT=this.value"')}${sel("splg",[["enabled","All enabled plugins"],["all","All plugins"],...en.map(p=>[p.name,p.fullName||p.name])],SPLG,'style="margin:0;flex:1;min-width:140px" onchange="SPLG=this.value"')}<button class="btn p" id="sgo" onclick="sGo()">Search</button></div></div><div id="srr" style="margin-top:16px"></div>`;if(SJ)sDraw();$("sq").focus()}
async function sGo(){if(SJ&&SJ.running){await sStop();return}const p=$("sq").value.trim();if(!p)return;if(SJ)qb("search/delete",{form:{id:SJ.id}}).catch(()=>{});
try{const r=await qb("search/start",{form:{pattern:p,category:SCAT,plugins:SPLG}});SJ={id:r.id,pattern:p,running:true,total:0};SRES=[];sDraw();sPoll()}catch(e){toast("Couldn't start: "+e.message)}}
async function sStop(){if(!SJ)return;try{await qb("search/stop",{form:{id:SJ.id}})}catch(e){}SJ.running=false;sDraw()}
async function sPoll(){const id=SJ&&SJ.id;if(!id)return;try{const r=await qb("search/results",{qs:{id,limit:0,offset:0}});if(!SJ||SJ.id!=id)return;SRES=r.results||[];SJ.total=r.total;SJ.running=r.status=="Running";if(page=="sr"&&SRV=="find")sDraw();if(SJ.running)setTimeout(sPoll,1500)}catch(e){if(SJ)SJ.running=false;if(page=="sr")sDraw()}}
function sDraw(){const b=$("sgo");if(b){b.textContent=SJ&&SJ.running?"■ Stop":"Search";b.className="btn "+(SJ&&SJ.running?"d":"p")}const el=$("srr");if(!el||!SJ)return;
let l=SRES.filter(x=>(!SRS.q||(x.fileName||"").toLowerCase().includes(SRS.q))&&(+x.nbSeeders||0)>=SRS.min);const k=SRS.sort;l.sort((a,b)=>SRS.dir*(k=="fileName"||k=="engineName"?String(a[k]).localeCompare(String(b[k])):(+a[k]||0)-(+b[k]||0)));window.__sr=l;
const sorts=[["nbSeeders","Seeds"],["fileSize","Size"],["pubDate","Date"],["fileName","Name"],["engineName","Site"]];
el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><b style="flex:1;min-width:160px">${SJ.running?"Searching… ":""}${SRES.length} result${SRES.length==1?"":"s"}${l.length!=SRES.length?" · "+l.length+" shown":""}</b><input class="f" style="margin:0;width:180px" placeholder="Filter results…" value="${esc(SRS.q)}" oninput="SRS.q=this.value.toLowerCase();clearTimeout(window.__sq);window.__sq=setTimeout(()=>{sDraw();const e=document.querySelector('#srr input.f');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},250)"><label class="tg" style="font-size:13px">Min seeds <input class="f" type="number" min="0" style="margin:0;width:70px;padding:6px 8px" value="${SRS.min}" onchange="SRS.min=+this.value||0;sDraw()"></label></div>
<div class="chips" style="margin-bottom:6px">${sorts.map(s=>`<span class="chip ${SRS.sort==s[0]?"on":""}" onclick="SRS.dir=SRS.sort=='${s[0]}'?-SRS.dir:(${s[0]=="fileName"||s[0]=="engineName"?1:-1});SRS.sort='${s[0]}';sDraw()">${s[1]}${SRS.sort==s[0]?(SRS.dir<0?" ↓":" ↑"):""}</span>`).join("")}</div>
${l.slice(0,200).map((x,i)=>`<div class="row" style="align-items:flex-start;font-size:13px"><div style="flex:1;min-width:0"><div style="word-break:break-word">${esc(x.fileName)}</div><div style="font-size:12px;color:var(--m);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:3px"><span>${x.fileSize>0?fB(x.fileSize):"? size"}</span><span style="color:var(--g)">▲ ${x.nbSeeders<0?"?":x.nbSeeders}</span><span>▼ ${x.nbLeechers<0?"?":x.nbLeechers}</span><span>${esc(x.engineName||x.siteUrl||"")}</span>${x.pubDate>0?`<span>${esc(fDt(x.pubDate))}</span>`:""}</div></div><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn p" style="padding:4px 12px" onclick="sGet(${i})">Download</button>${x.descrLink&&/^https?:/.test(x.descrLink)?`<a class="btn" style="padding:4px 12px;text-decoration:none;color:inherit" href="${esc(x.descrLink)}" target="_blank" rel="noopener">Page</a>`:""}</span></div>`).join("")||(SJ.running?"<p style='color:var(--m)'>Waiting for results…</p>":"<p style='color:var(--m)'>Nothing found.</p>")}</div>`}
async function sGet(i){const x=window.__sr[i];const c=Object.keys(D.cats).sort();const o=await dlg("Download",`<p style="font-size:13px;word-break:break-word;margin-bottom:8px">${esc(x.fileName)}</p><label class="k">Category</label>${sel("sgc",[["","— none —"],...c],"")}<label class="tg" style="display:flex;margin:8px 0"><input type="checkbox"> Add paused</label>`,[{l:"Add to qBittorrent",v:1,c:"p"},{l:"Cancel",v:0}]);if(!o||!o.v)return;
const f={urls:x.fileUrl};if($("sgc").value)f.category=$("sgc").value;f[QV[1]>=11?"stopped":"paused"]=!!o.chk[0];
try{let r;if(!/^magnet:/i.test(x.fileUrl)&&!$("sgc").value&&!o.chk[0]){try{r=await qb("search/downloadTorrent",{form:{torrentUrl:x.fileUrl,pluginName:x.engineName}});r="Ok"}catch(e){r=null}}if(r==null)r=await qb("torrents/add",{form:f});toast(/ok/i.test(String(r))?"Added":"qBittorrent said: "+r);await sync()}catch(e){toast("Failed: "+e.message)}}
async function sPlg(tabs){$("pg").innerHTML=hd("Search","Search plugins add sites to qBittorrent's search.",`<button class="btn" onclick="sUpd()">Update all</button><button class="btn p" onclick="sInst()">+ Install</button>`)+tabs+`<div id="srb"><div class="card">Loading…</div></div>`;
try{await sPlugins();$("srb").innerHTML=`<div class="card">${SPL.map(p=>`<div class="row" style="font-size:13px"><label class="tg"><input type="checkbox" ${p.enabled?"checked":""} data-n="${esc(p.name)}" onchange="sTog(this.dataset.n,this.checked)"></label><div style="flex:1;min-width:0"><b>${esc(p.fullName||p.name)}</b> <span style="color:var(--m)">v${esc(p.version)}</span><div style="font-size:12px;color:var(--m);word-break:break-all">${esc(p.url||"")}</div></div><button class="btn d" style="padding:3px 12px" data-n="${esc(p.name)}" onclick="sUn(this.dataset.n)">Remove</button></div>`).join("")||"<p style='color:var(--m)'>No plugins installed.</p>"}<p style="font-size:12px;color:var(--m);margin-top:12px">Find plugins on the qBittorrent wiki page “Unofficial search plugins”. Install one by pasting the link to its .py file.</p></div>`}catch(e){$("srb").innerHTML=qerr(e)}}
async function sTog(n,v){try{await qb("search/enablePlugin",{form:{names:n,enable:v}});toast(v?"Enabled":"Disabled")}catch(e){toast("Failed: "+e.message)}}
async function sUn(n){if(!await askOk("Remove search plugin “"+n+"”?","Remove"))return;try{await qb("search/uninstallPlugin",{form:{names:n}});setTimeout(()=>go("sr"),1000)}catch(e){toast("Failed: "+e.message)}}
async function sInst(){const o=await dlg("Install search plugin",`<label class="k">Link to the plugin's .py file (one per line)</label><textarea class="f" id="spu" rows="3" style="font:inherit" placeholder="https://raw.githubusercontent.com/…/plugin.py"></textarea>`,[{l:"Install",v:1,c:"p"},{l:"Cancel",v:0}]);if(!o||!o.v)return;const s=$("spu").value.split("\n").map(x=>x.trim()).filter(Boolean).join("|");if(!s)return;
try{await qb("search/installPlugin",{form:{sources:s}});toast("Installing…");setTimeout(()=>go("sr"),2500)}catch(e){toast("Failed: "+e.message)}}
async function sUpd(){try{await qb("search/updatePlugins",{form:{}});toast("Updating plugins…");setTimeout(()=>go("sr"),3000)}catch(e){toast("Failed: "+e.message)}}
