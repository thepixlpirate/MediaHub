const N=[];[["radarr",rQ,rHe],["sonarr",sQ,sHe],["lidarr",lQ,lHe]].forEach(([id,q,h])=>{if(q.ok)(q.v.records||[]).filter(r=>/importBlocked|importPending|failedPending|failed/i.test(r.trackedDownloadState||"")||/warning|error/i.test(r.trackedDownloadStatus||"")).forEach(r=>N.push({app:id,t:(r.movie?.title||r.series?.title||r.artist?.artistName||r.title),s:(r.statusMessages||[]).map(x=>(x.messages||[]).join(" ")).join(" ")||r.errorMessage||"Needs a manual import",tag:"Stuck download",c:"o"}));
if(h.ok)h.v.filter(x=>/downloadclient|rootfolder|importmechanism/i.test(x.source||"")).forEach(x=>N.push({app:id,t:SN[id],s:x.message,tag:x.type=="error"?"Error":"Warning",c:x.type=="error"?"r":"o"}))});
Object.entries(D.st).forEach(([id,r])=>{if(!r.ok)N.push(D.cfg[id]?{app:id,t:SN[id],s:"Can't reach it. Check that it's running and the address is right.",tag:"Offline",c:"r"}:{app:id,t:SN[id],s:"Not set up yet. Open its tab, then Settings → Connection.",tag:"Not set up",c:""})});

/* storage */
const disks=[];[[rD,rF],[sD,sF],[lD,lF]].forEach(([d,f])=>{if(!d.ok)return;const roots=f.ok?f.v.map(x=>x.path):[];d.v.forEach(x=>{if(!x.totalSpace||x.totalSpace<1e10)return;if(roots.length&&!roots.some(p=>p.startsWith(x.path)))return;if(roots.length){const best=roots.map(p=>d.v.filter(y=>p.startsWith(y.path)).sort((a,b)=>b.path.length-a.path.length)[0]);if(!best.includes(x))return}const k=x.totalSpace+"|"+x.freeSpace;if(!disks.some(y=>y.k==k))disks.push({...x,k})})});D.disks=disks;
OV.data=D;OV.t=Date.now();OV.busy=false;ovDraw();ovLive()}
function ovDraw(){const D=OV.data;if(!D.C)return;const go=id=>`onclick="sw('${id}')"`;
$("ov").innerHTML=`<h1>Overview</h1><div class="sub">Everything at a glance · updated ${ago(OV.t)} <button class="btn" style="padding:4px 12px;font-size:12px" onclick="ovLoad(1)">↻ Refresh</button></div>
<div class="og">${D.C.map(([id,l,n,x,lid])=>`<div class="oc st ${n==null?"off":""}" style="--sc:${SC[id]}" ${go(id)}><div class="tl"><img src="/apps/${id}.svg" alt="">${l}</div><div class="n">${n==null?"—":Number(n).toLocaleString()}</div><div class="x" ${lid?`id="${lid}"`:""}>${n==null?(D.cfg[id]?"Can't reach it":"Not set up yet"):(x||[]).filter(Boolean).map(oe).join("<br>")}</div></div>`).join("")}</div>
<div class="o2"><div class="oc wide"><h3>Recently downloaded <small>${D.R.length?"latest "+D.R.length:""}</small></h3>${D.R.length?`<div class="rec">${D.R.map(x=>`<div class="rc ${x.sq?"sq":""}" style="--sc:${SC[x.app]}" ${go(x.app)} title="${oe(x.title)}"><div class="po" ${x.img?`data-bg="${oe(x.img)}"`:""}><span class="ph">${x.ph||(x.app=="lidarr"?"🎵":x.app=="sonarr"?"📺":"🎬")}</span><b>${SN[x.app]}</b></div><div class="t">${oe(x.title)}</div><div class="s">${oe(x.sub||"")}</div><div class="s">${ago(x.date)}</div></div>`).join("")}</div>`:'<div class="emp">Nothing downloaded in a while.</div>'}</div>
<div class="oc"><h3>Downloading now</h3><div id="ovdl">${OV.dl||'<div class="emp">Checking…</div>'}</div></div>
<div class="oc"><h3>Needs attention <small>${D.N.length||""}</small></h3>${D.N.map(x=>`<div class="lr" style="--sc:${SC[x.app]}" ${go(x.app)}><span class="dot"></span><div class="d"><div>${oe(x.t)}</div><div class="m">${oe(x.s)}</div></div><span class="tg2 ${x.c}">${oe(x.tag)}</span></div>`).join("")||'<div class="emp">All good. Nothing needs you right now. 👍</div>'}</div>
<div class="oc"><h3>Coming up <small>next 2 weeks</small></h3>${D.U.map(x=>`<div class="lr" style="--sc:${SC[x.app]}" ${go(x.app)}><span class="dot"></span><div class="d"><div>${oe(x.t)}</div><div class="m">${oe(x.s)}</div></div><span class="m" style="white-space:nowrap">${inDays(x.d)}</span></div>`).join("")||'<div class="emp">Nothing scheduled.</div>'}</div>
<div class="oc dk"><h3>Storage</h3>${D.disks.map(d=>{const u=1-d.freeSpace/d.totalSpace;return `<div style="margin-bottom:12px;font-size:13px"><div style="display:flex;justify-content:space-between;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${oe(d.label||d.path)}</span><span class="m" style="color:var(--m);white-space:nowrap">${ofb(d.freeSpace)} free of ${ofb(d.totalSpace)}</span></div><div class="bar"><i style="width:${(u*100).toFixed(1)}%;${u>.9?"background:#fb5a7a":""}"></i></div></div>`}).join("")||'<div class="emp">No disk info yet.</div>'}</div>
<div class="oc"><h3>Apps</h3>${SV.map(([id,name])=>{const r=D.st[id]||{},v=r.ok?(typeof r.v=="string"?r.v:r.v.version||""):"";return `<div class="lr" style="--sc:${SC[id]}" ${go(id)}><img src="/apps/${id}.svg" alt="" style="width:20px;height:20px;border-radius:5px"><div class="d"><div>${name}</div></div><span class="m">${oe(String(v).replace(/^v/,""))}</span><span class="tg2 ${r.ok?"g":D.cfg[id]?"r":""}">${r.ok?"Online":D.cfg[id]?"Offline":"Not set up"}</span></div>`}).join("")}</div></div>`;
document.querySelectorAll("#ov [data-bg]").forEach(e=>{const u=e.dataset.bg,i=new Image();i.onload=()=>{e.style.backgroundImage=`url("${u}")`;const p=e.querySelector(".ph");if(p)p.remove()};i.src=u})}
async function ovLive(){const el=$("ovdl");if(!el)return;const [t,x,q]=await Promise.all([ok(qb("torrents/info?filter=downloading&sort=dlspeed&reverse=true")),ok(qb("transfer/info")),ok(sab({mode:"queue",limit:10}))]);const L=[];

if(x.ok&&$("qbs")&&t.ok){const c=OV.data.C.find(c=>c[0]=="qbittorrent");if(c&&c[3])$("qbs").innerHTML=oe(c[3][0])+"<br>"+oe(`↓ ${ofb(x.v.dl_info_speed)}/s · ↑ ${ofb(x.v.up_info_speed)}/s`)}
