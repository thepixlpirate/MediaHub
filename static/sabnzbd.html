<style>

.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}.bn a{flex:1;text-align:center;font-size:10px;color:var(--m);padding:6px 0;border-radius:14px;cursor:pointer}.bn a em{display:block;font-style:normal}.bn a em svg{display:block;margin:0 auto 3px}.bn a.on{background:rgba(189,93,9,.25);color:#fff}}

<div id="login"><form class="box" id="lf"><img class="lg" src="/icon.png" alt="Media Hub" style="border-radius:22%;object-fit:contain"><h2>Sign in</h2>
<label id="lu">Username</label><input id="un" autocomplete="username" required><label>Password</label><input id="pw" type="password" autocomplete="current-password" required>
<label id="p2l" style="display:none">Confirm password</label><input id="pw2" type="password" style="display:none">

<div id="app"><aside><div class="br"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg></div><span>SAB<span style="color:var(--v2)">nzbd</span></span></div><nav id="nv"></nav><div class="st" id="st"></div></aside>

<script>
const A={name:"SABnzbd",port:8888},SB="/s/sabnzbd";
const PAGES=[["qu","dl","Queue"],["hi","clock","History"],["ad","plus","Add"],["wr","alert","Warnings"],["sx","pulse","Stats"],["se","gear","Settings"]];

dl:'<path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>',up:'<path d="M12 21V9M7 13l5-5 5 5M4 4h16"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',

const ico=n=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

const fB=b=>{b=+b||0;const u=["B","KB","MB","GB","TB","PB"];let i=0;while(b>=1024&&i<5){b/=1024;i++}return (i<2?Math.round(b):b.toFixed(i>3?2:1))+" "+u[i]};

async function feedDel(fi){const f=CFG.rss[fi];if(!await askOk(`Delete feed “${f.name}” and its filters?`,"Delete"))return;try{await sab("del_config",{section:"rss",keyword:f.name});go("se")}catch(e){toast("Failed: "+e.message)}}
async function fltSend(fi,p){const f=CFG.rss[fi];await sab("set_config",{...feedBase(f),...p});await sab("set_config",feedBase(f))}
async function fltEdit(fi,i){const f=CFG.rss[fi],fl=filt8(f),x=i>=0?fl[i]:["","","","A","","-100","1"];
const o=await dlg(i>=0?"Edit filter":"Add filter",`<label class="k">Type</label>${sel("flt",FT8,x[3])}<label class="k">Text, pattern or value</label><input class="f" id="flx" value="${esc(x[4])}" placeholder="e.g. 1080p or re:^Show.Name"><p style="font-size:11px;color:var(--m);margin:-6px 0 12px;line-height:1.4">Plain words match anywhere (use * as a wildcard). Start with <code>re:</code> for a regular expression. Sizes: e.g. <code>5G</code>, <code>700M</code>. Age: e.g. <code>&lt;7d</code>.</p><label class="k">Category for matches</label>${sel("flc",catOpts(),x[0]??"")}<label class="k">Post-processing</label>${sel("flp",[["","Default"],...PP],x[1]??"")}<label class="k">Script</label>${sel("fls",scrOpts(),x[2]??"")}<label class="k">Priority</label>${sel("flr",PRI,x[5]??-100)}${ck8("fle","Enabled",+x[6])}`,[{l:"Save",v:1,c:"p"},{l:"Cancel",v:0}]);if(!o||!o.v)return;
if(!$("flx").value.trim()){toast("Enter the filter text");return}
try{await fltSend(fi,{filter_action:i>=0?"update":"add",index:i>=0?i:fl.length,filter_type:$("flt").value,filter_text:$("flx").value.trim(),cat:$("flc").value,pp:$("flp").value,script:$("fls").value,priority:$("flr").value,enabled:o.chk[0]?"1":"0"});toast("Filter saved");RO8[f.name]=true;go("se")}catch(e){toast("Failed: "+e.message)}}
async function fltDel(fi,i){const f=CFG.rss[fi];if(!await askOk("Delete this filter?","Delete"))return;try{await sab("set_config",{section:"rss",keyword:f.name,filter_action:"delete",index:i});RO8[f.name]=true;go("se")}catch(e){toast("Failed: "+e.message)}}
async function fltMove(fi,i,d){const f=CFG.rss[fi],fl=filt8(f),j=i+d;if(j<0||j>=fl.length)return;const x=fl[i];
try{await fltSend(fi,{filter_action:"update",index:i,new_index:j,filter_type:x[3],filter_text:x[4],cat:x[0]??"",pp:x[1]??"",script:x[2]??"",priority:x[5]??-100,enabled:x[6]??"1"});RO8[f.name]=true;go("se")}catch(e){toast("Failed: "+e.message)}}

/* ---------- Scheduler ---------- */
const schLines=()=>{const v=CFG.misc?.schedlines??CFG.schedules??[];return (Array.isArray(v)?v:String(v).split(",")).map(s=>String(s).trim()).filter(Boolean)};
const schParse=l=>{const p=l.split(/\s+/);return{en:p[0]=="1",m:+p[1],h:+p[2],d:p[3],a:(p[4]||"").toLowerCase(),arg:p.slice(5).join(" ")}};
const schDays=d=>d=="1234567"||!/^\d+$/.test(d)?"Every day":d=="12345"?"Weekdays":d=="67"?"Weekends":[...d].map(x=>DAY8[+x-1]).filter(Boolean).join(", ");
function schDraw(){const L=schLines();window.__sl=L;
$("sx8").innerHTML=`<div class="card" style="max-width:820px"><h3>Scheduler</h3><p style="font-size:13px;color:var(--m);margin-bottom:6px">Do things automatically at set times, like pausing during the day or limiting speed at night.</p>
${L.map((l,i)=>{const s=schParse(l),act=(SA8.find(a=>a[0]==s.a)||[s.a,s.a])[1];return `<div class="row" style="font-size:13px"><label class="tg"><input type="checkbox" ${s.en?"checked":""} onchange="schTog(${i},this.checked)"></label><div style="flex:1;min-width:0"><b>${String(s.h).padStart(2,"0")}:${String(s.m).padStart(2,"0")}</b> · ${esc(schDays(s.d))}<div style="color:var(--m)">${esc(act)}${s.arg?" · "+esc(s.arg):""}</div></div><button class="btn" style="padding:3px 12px" onclick="schEdit(${i})">Edit</button><button class="btn d" style="padding:3px 12px" onclick="schDel(${i})">Delete</button></div>`}).join("")||"<p style='color:var(--m)'>Nothing scheduled.</p>"}
<div class="al-b" style="margin-top:12px"><button class="btn p" onclick="schEdit(-1)">+ Add schedule</button></div>
<p style="font-size:12px;color:var(--m);margin-top:12px;line-height:1.5">SABnzbd starts using schedule changes after it restarts. When you're done editing, <a href="#" onclick="event.preventDefault();sysAct('restart')">restart SABnzbd</a>.</p></div>`}
async function schEdit(i){const s=i>=0?schParse(window.__sl[i]):{en:true,m:0,h:1,d:"1234567",a:"pause",arg:""};window.__se8={srv:(CFG.servers||[]).map(x=>[x.name,x.displayname||x.name]),cats:(CFG.categories||[]).map(c=>c.name).filter(n=>n&&n!="*")};
const pr=dlg(i>=0?"Edit schedule":"Add schedule",`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px"><div><label class="k">Hour (0–23)</label><input class="f" id="shh" type="number" min="0" max="23" value="${s.h}"></div><div><label class="k">Minute (0–59)</label><input class="f" id="shm" type="number" min="0" max="59" value="${s.m}"></div></div>
<label class="k">Days</label><div style="display:flex;gap:4px 12px;flex-wrap:wrap;margin:6px 0 12px">${DAY8.map((d,k)=>`<label class="tg" style="font-size:13px"><input type="checkbox" class="shd" value="${k+1}" ${!/^\d+$/.test(s.d)||s.d.includes(String(k+1))?"checked":""}> ${d}</label>`).join("")}</div>
<label class="k">Action</label>${sel("sha",SA8.some(x=>x[0]==s.a)?SA8:[...SA8,[s.a,s.a]],s.a,'onchange="schArg()"')}<div id="sharg"></div>`,[{l:"Save",v:1,c:"p"},{l:"Cancel",v:0}]);schArg(s.arg);const o=await pr;if(!o||!o.v)return;
const h=Math.round(+$("shh").value),m=Math.round(+$("shm").value);if(!(h>=0&&h<=23&&m>=0&&m<=59)){toast("Check the time");return}const days=[...document.querySelectorAll(".shd:checked")].map(c=>c.value).join("")||"1234567",a=$("sha").value,arg=$("shg")?$("shg").value.trim():"";
if(a=="speedlimit"&&!arg){toast("Enter a speed limit");return}if(/[,"']/.test(arg)){toast("The value can't contain commas or quotes");return}
const L=[...window.__sl],line=`${s.en?1:0} ${m} ${h} ${days} ${a}${arg?" "+arg:""}`;if(i>=0)L[i]=line;else L.push(line);await schSave(L)}
function schArg(cur){const a=$("sha").value,{srv,cats}=window.__se8;let h="";
if(a=="speedlimit")h=`<label class="k">Speed limit: a percentage like <code>50%</code>, or a speed like <code>5M</code> (5 MB/s). <code>0</code> = no limit.</label><input class="f" id="shg" value="${esc(cur??"")}">`;
else if(a=="enable_server"||a=="disable_server")h=srv.length?`<label class="k">Server</label>${sel("shg",srv,cur)}`:"<p style='font-size:13px;color:var(--m)'>No servers set up.</p>";
else if(a=="pause_cat"||a=="resume_cat")h=cats.length?`<label class="k">Category</label>${sel("shg",cats.map(c=>[c,c]),cur)}`:"<p style='font-size:13px;color:var(--m)'>No categories set up.</p>";
$("sharg").innerHTML=h}
async function schSave(L){try{await sab("set_config",{section:"misc",keyword:"schedlines",value:L.length?L.join(",")+",":""});await cfgLoad();schDraw();toast("Saved. Restart SABnzbd to apply.")}catch(e){toast("Failed: "+e.message)}}
async function schTog(i,on){const L=[...window.__sl],p=L[i].split(/\s+/);p[0]=on?"1":"0";L[i]=p.join(" ");await schSave(L)}
async function schDel(i){if(!await askOk("Delete this schedule?","Delete"))return;const L=[...window.__sl];L.splice(i,1);await schSave(L)}

/* ===== v10: this app's icon in the sidebar and browser tab ===== */
function appIcon(){const im=new Image();im.onload=()=>{const l=document.querySelector(".br .logo");if(l){l.innerHTML="";l.classList.add("hasimg");l.style.background="none";l.style.boxShadow="none";im.style.cssText="width:100%;height:100%;object-fit:contain;border-radius:8px";l.appendChild(im)}let f=document.querySelector("link[rel~=icon]");if(!f){f=document.createElement("link");f.rel="icon";document.head.appendChild(f)}f.href=im.src};im.src="/apps/sabnzbd.svg"}
appIcon();
boot();

</script></body></html>
