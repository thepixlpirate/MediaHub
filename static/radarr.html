/* ===== v9: bell shows only download-client connection problems and newly downloaded media ===== */
async function bellPoll(){if(document.hidden)return;try{if(!BS.ready)await bellLoad();const [h,hi]=await Promise.all([api("health").catch(()=>[]),api(`history?pageSize=150&sortKey=date&sortDirection=descending&${A.inc}`).catch(()=>({records:[]}))]),wk=Date.now()-7*864e5,AL=[],G={};
h.filter(x=>/downloadclient/i.test(x.source||"")).forEach(x=>AL.push({key:("h|"+(x.source||"")+"|"+(x.message||"")).slice(0,230),t:x.type=="error"?"Can't connect":"Download client",c:x.type=="error"?"r":"o",title:"Download client problem",msg:x.message,id:0}));
(hi.records||[]).filter(r=>/imported$/i.test(r.eventType||"")&&new Date(r.date)>wk).forEach(r=>{const k=r.downloadId||(A.k=="artist"&&r.albumId?"al"+r.albumId+"|"+r.date.slice(0,13):"i"+r.id);(G[k]=G[k]||[]).push(r)});
Object.entries(G).slice(0,30).forEach(([k,l])=>{const r=l[0],n=l.length,ex=A.k=="series"&&n>1?`${n} episodes`:A.k=="artist"?(r.album?.title||"")+(n>1?` · ${n} tracks`:""):pextra(r);AL.push({key:("d|"+k).slice(0,230),t:"Downloaded",c:"g",title:ptitle(r),msg:[ex,r.quality?.quality?.name].filter(Boolean).join(" · "),id:par(r).id||r[ID8]||0,date:r.date})});
BELL=AL;bellCount()}catch(e){}}
