<style>

.wide{grid-column:1/-1}.mcg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.mcg .h{color:var(--m);font-size:12px}.mcd{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:13px;color:var(--m)}.mcd.on{background:var(--v);color:#fff;cursor:pointer;box-shadow:0 0 12px rgba(117,0,40,.55)}.mcd.on:hover{filter:brightness(1.25)}.mcd.td{outline:1.5px solid var(--v2)}.bn{display:none}.row[onclick]{cursor:pointer}.cal .d span u{text-decoration:none}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{display:none}main{padding:0 14px 90px}.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.cal .d{min-height:54px}.cal .d span u{display:none}.cal .d span{display:inline-block;margin-right:2px}.mh{flex-direction:column}.mh .po{width:120px}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}.bn a{flex:1;text-align:center;font-size:10px;color:var(--m);padding:6px 0;border-radius:14px;cursor:pointer}.bn a em{display:block;font-style:normal}.bn a em svg{display:block;margin:0 auto 3px}.bn a.on{background:rgba(117,0,40,.25);color:#fff}}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px}#md .card{position:relative}.mact{position:absolute;top:18px;right:18px;display:flex;gap:8px}.mi{padding-right:250px}nav a em svg{display:block}input[type=checkbox]{accent-color:var(--v2)}.hero{position:relative;border-radius:24px;overflow:hidden;background:var(--c) center/cover}.hero .hin{position:relative;padding:20px;background:linear-gradient(90deg,var(--bg) 25%,rgba(0,0,0,.55))}.al{border-top:1px solid var(--ln)}.alh{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;flex-wrap:wrap}.trk{padding:0 0 10px 66px}@media(max-width:860px){.mi{padding-right:0}.trk{padding-left:0}}@media(max-width:860px){.card>h3{cursor:pointer;display:flex;align-items:center;gap:8px}.card>h3:after{content:"▾";margin-left:auto;color:var(--m);font-size:14px}.card.col>h3:after{content:"▸"}.card.col>*:not(h3){display:none!important}}#bell{position:relative}.bdg{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--r);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 4px}#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:25;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:94vw;background:var(--c2);border:1px solid var(--ln);border-radius:20px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.5)}#selbar #selc{align-self:center;font-size:13px;color:var(--m);padding:0 6px}.pc.sel{outline:3px solid var(--v2);outline-offset:-3px}.pc.sel .po:after{content:'✓';position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--v);display:grid;place-items:center;font-weight:800}.live{color:var(--g);font-size:12px;font-weight:500}@media(max-width:860px){#selbar{bottom:78px}}
/* v6 additions */

.fbox{margin-top:16px;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--s)}.fbox .ft{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}

@media(max-width:860px){.mact{grid-template-columns:repeat(3,1fr)}}

.tag.a{background:var(--v);color:#fff}
.it{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:10px}.it.sel{border-color:var(--acc)}.it .nm{font-weight:600;word-break:break-word;cursor:pointer}.it .nm:hover{color:var(--v2)}
.it .mt{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--m);margin-top:8px;align-items:center}.it .ab{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.it .ab .btn{padding:5px 14px;font-size:13px}
.ck{width:18px;height:18px;margin-top:3px;flex:none}textarea.f{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;width:100%;margin:4px 0 12px;outline:0;color:var(--t)}

#cf{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;place-items:center;z-index:80;padding:14px}#cf .card{width:min(460px,100%);max-height:92vh;overflow:auto;background:var(--c)}#cf .card>h3:after{display:none}

.bc .cv{aspect-ratio:2/3;background:var(--c2) center/cover no-repeat;position:relative}.bc .cv .tag{position:absolute;left:8px;bottom:8px}.bc .cv .tag.ty{left:auto;right:8px;top:8px;bottom:auto}

.logo.hasimg:after{display:none!important}.logo{background:none!important;box-shadow:none!important}</style></head><body>
<div id="login"><form class="box" id="lf"><img class="lg" src="/icon.png" alt="Media Hub" style="border-radius:22%;object-fit:contain"><h2>Sign in</h2>
<label id="lu">Username</label><input id="un" autocomplete="username" required><label>Password</label><input id="pw" type="password" autocomplete="current-password" required>
<label id="p2l" style="display:none">Confirm password</label><input id="pw2" type="password" style="display:none">
<div class="rm"><input type="checkbox" id="rem" style="width:auto;margin:0" checked>Remember me</div><button class="go" id="gb">SIGN IN</button><div class="err" id="le"></div><small id="lh"></small></form></div>
<div id="app"><aside><div class="br"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg></div><span>Bookarr<span style="color:var(--v2)">Hub</span></span></div><nav id="nv"></nav><div class="st" id="st"></div></aside>
<main><div class="top"><input id="q" placeholder="Search library…"><button class="btn p" id="sb" onclick="go('ad')">+ Add</button></div><div id="pg"></div></main></div>
<div class="bn" id="bn"></div><div id="md"></div><div id="toast"></div>
<script>
const A={name:"Bookarr",port:8787},SB="/s/bookarr";
const PAGES=[["ov","grid","Overview"],["lb","book","Library"],["ad","plus","Add"],["wa","alert","Wanted"],["ac","pulse","Activity"],["se","gear","Settings"]];
const $=i=>document.getElementById(i),L=localStorage,X={"X-Requested-With":"hub"};
const IC={grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
dl:'<path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>',up:'<path d="M12 21V9M7 13l5-5 5 5M4 4h16"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
srv:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)};
const fB=b=>{b=+b||0;const u=["B","KB","MB","GB","TB","PB"];let i=0;while(b>=1024&&i<5){b/=1024;i++}return (i<2?Math.round(b):b.toFixed(i>3?2:1))+" "+u[i]};
const fS=b=>fB(b)+"/s",fD=ts=>ts>0?new Date(ts*1000).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):"—";
const fT=s=>{s=+s;if(!isFinite(s)||s<0||s>=8640000)return"∞";const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+"d "+h+"h":h?h+"h "+m+"m":m?m+"m "+Math.floor(s%60)+"s":Math.floor(s)+"s"};
const post=(u,b)=>fetch(u,{method:"POST",headers:{...X,"Content-Type":"application/json"},body:JSON.stringify(b||{})});
const hd=(t,s,x="")=>`<div class="ph"><h1>${t}</h1><p>${s}</p><div class="sp">${x}</div></div>`;
const XB='<div class="xw"><button class="xb" aria-label="Close" onclick="$(\'md\').style.display=\'none\'">✕</button></div>';
$("md").onclick=e=>{if(e.target.id=="md"){$("md").style.display="none";if(window.onModalClose)onModalClose()}};
function dlg(title,body,btns){return new Promise(res=>{let o=$("cf");if(!o){o=document.createElement("div");o.id="cf";document.body.appendChild(o)}
o.innerHTML=`<div class="card"><h3>${title}</h3><div>${body}</div><div class="cfb">${btns.map((b,i)=>`<button class="btn ${b.c||""}" data-i="${i}">${b.l}</button>`).join("")}</div></div>`;o.style.display="grid";
o.onclick=e=>{if(e.target===o){o.style.display="none";res(null)}};
o.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const v=btns[+b.dataset.i].v,chk=[...o.querySelectorAll("input[type=checkbox]")].map(c=>c.checked);o.style.display="none";res({v,chk})})})}

library:[["comic","Comics folder","t"],["ebook","Ebooks folder","t"],["audiobook","Audiobooks folder","t"],["downloads","Downloads folder","t"]],
media:[["autoSearchMinutes","Auto-search every (minutes)","n"],["minSeeders","Minimum seeders (torrents)","n"],["importMode","Import mode","t"],["downloadSubfolder","Download subfolder for books","t"],["catComic","Comics category","t"],["catEbook","Ebooks category","t"],["catAudiobook","Audiobooks category","t"],["remotePath","Remote path (path mapping)","t"],["localPath","Local path (path mapping)","t"]],
quality:[["comic","Comic formats, best first (comma separated)","t"],["ebook","Ebook formats, best first","t"],["audiobook","Audiobook formats, best first","t"],["comicMaxMB","Comic max size (MB)","n"],["ebookMaxMB","Ebook max size (MB)","n"],["audiobookMaxMB","Audiobook max size (MB)","n"],["requirePreferred","Only accept the preferred formats","b"]],
metadata:[["comicvineKey","ComicVine API key (free)","p"],["googleBooksKey","Google Books API key (optional)","p"],["audibleRegion","Audible region (com, co.uk, de…)","t"],["writeTags","Write tags into downloaded files","b"]],
notifications:[["onGrab","Notify when a release is grabbed","b"],["onImport","Notify when a download is imported","b"],["onFail","Notify when a download fails","b"],["discordWebhook","Discord webhook URL","t"],["pushoverUser","Pushover user key","t"],["pushoverToken","Pushover app token","p"],["telegramToken","Telegram bot token","p"],["telegramChat","Telegram chat ID","t"],["webhookUrl","Generic webhook URL","t"]],
email:[["smtpHost","SMTP server","t"],["smtpPort","SMTP port","n"],["user","SMTP username","t"],["password","SMTP password","p"],["from","From address","t"],["kindleAddress","Send-to-Kindle address (…@kindle.com)","t"],["kindleFormat","Kindle device format","s",["azw3","mobi"]]],
converter:[["transmuteUrl","Transmute URL","t"],["transmuteKey","Transmute API key","p"]],
security:[["authMode","Bookarr's own web login","s",["none","basic"]],["username","Username","t"],["password","Password","p"]],
general:[["logLevel","Log level","s",["debug","info","warning","error"]]]};
const STABS=[["conn","Connection"],["indexer","Indexers"],["clients","Download clients"],["folders","Folders & media"],["quality","Quality"],["metadata","Metadata"],["notifications","Notifications"],["email","Kindle"],["converter","Converter"],["devices","Reader devices"],["system","System"],["security","Security"],["acct","Account"]];
const TESTS={indexer:["indexer/test","Test Prowlarr"],notifications:["notification/test","Send test notification"],converter:["converter/test","Test converter"]};
async function cfForm(secs){let h="";for(const sec of secs){const c=await api("config/"+sec);h+=`<div class="card" style="margin-bottom:14px;max-width:760px">${secs.length>1?`<h3>${{library:"Library folders",media:"Media management"}[sec]||sec}</h3>`:""}${CF[sec].map(f=>{const v=c[f[0]],id=`cf-${sec}-${f[0]}`;return f[2]=="b"?`<label class="tg" style="display:flex;margin:8px 0"><input type="checkbox" id="${id}" ${+v?"checked":""}> ${f[1]}</label>`:`<label class="k">${f[1]}</label>`+(f[2]=="s"?sel(id,f[3],v):`<input class="f" id="${id}" ${f[2]=="n"?'type="number"':f[2]=="p"?'type="password" autocomplete="off"':""} value="${esc(v)}">`)}).join("")}</div>`}
return h+`<div style="display:flex;gap:8px;flex-wrap:wrap">${bt("Save","cfSave('"+secs.join(",")+"')","p")}${secs.length==1&&TESTS[secs[0]]?bt(TESTS[secs[0]][1],"cfTest('"+secs[0]+"')"):""}</div>`}
async function cfSave(secs){try{for(const sec of secs.split(",")){const b={};CF[sec].forEach(f=>{const e=$(`cf-${sec}-${f[0]}`);b[f[0]]=f[2]=="b"?(e.checked?1:0):f[2]=="n"?+e.value:e.value});await api("config/"+sec,{method:"PUT",body:b})}toast("Saved")}catch(e){toast("Failed: "+e.message)}}
async function cfTest(sec){await cfSave(sec);try{const r=await api(TESTS[sec][0],{method:"POST"});toast((r.ok===false?"✗ ":"✓ ")+(r.message||"Done"))}catch(e){toast("✗ "+e.message)}}
async function se(){let body="";
if(stab=="conn")body=connCard(`<label class="k">Bookarr API key (Bookarr → Settings → General) — stored only on the server</label><input class="f" id="ck" type="password" autocomplete="off" placeholder="${SET.hasKey?"Saved on the server — leave blank to keep":"paste API key"}">`,"Use the address with the port (e.g. http://192.168.1.10:8787). The API key is shown in Bookarr under Settings → General.");
else if(stab=="acct")body=acctCard();
else if(stab=="folders")body=await cfForm(["library","media"]);
else if(["indexer","quality","metadata","notifications","email","converter"].includes(stab))body=await cfForm([stab]);
else if(stab=="security")body=await cfForm(["security"])+`<div style="height:14px"></div>`+await cfForm(["general"]);
else if(stab=="clients")body=await scBody();
else if(stab=="devices")body=await devBody();
else body=await sysBody();
$("pg").innerHTML=hd("Settings","Connection and Bookarr configuration.",bt("🔒 Lock","lock()"))+stabs(STABS)+body}
/* download clients */
async function scBody(){const c=await api("downloadclient");window.__cl=c;return`<div class="card" style="max-width:760px"><h3>Download clients</h3>${c.map(x=>`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(x.name||x.kind)}</b> <span class="tag">${esc(x.kind)}</span><div style="font-size:12px;color:var(--m);word-break:break-all">${esc(x.url)} · category ${esc(x.category||"—")}</div></div><span class="x" style="white-space:nowrap"><button class="btn" style="padding:3px 10px" onclick="scTest(${x.id})">Test</button> <button class="btn" style="padding:3px 10px" onclick="scSetup(${x.id})">Set up folders</button> <button class="btn" style="padding:3px 10px" onclick="scEdit(${x.id})">Edit</button> <button class="btn d" style="padding:3px 10px" onclick="scDel(${x.id})">✕</button></span></div>`).join("")||"<span style='color:var(--m)'>None yet.</span>"}<button class="btn p" style="margin-top:12px" onclick="scEdit(0)">+ Add client</button><p style="font-size:12px;color:var(--m);margin-top:10px">Use the local address with the port (e.g. http://192.168.1.10:8080), not a Cloudflare address. Then tap “Set up folders”.</p></div>`}
async function scEdit(id){const x=(id&&window.__cl.find(c=>c.id==id))||{kind:"sabnzbd",name:"",url:"",apikey:"",username:"",password:"",category:""};
const o=await dlg(id?"Edit client":"Add client",`<label class="k">Name</label><input class="f" id="scn" value="${esc(x.name||"")}"><label class="k">Type</label>${sel("sck",[["sabnzbd","SABnzbd"],["qbittorrent","qBittorrent"]],x.kind)}<label class="k">URL</label><input class="f" id="scu" value="${esc(x.url)}" placeholder="http://192.168.1.10:8080"><label class="k">API key (SABnzbd)</label><input class="f" id="sca" type="password" autocomplete="off" value="${esc(x.apikey||"")}"><label class="k">Username (qBittorrent)</label><input class="f" id="scs" autocomplete="off" value="${esc(x.username||"")}"><label class="k">Password (qBittorrent)</label><input class="f" id="scp" type="password" autocomplete="new-password" value="${esc(x.password||"")}">`,[{l:"Save & test",v:1,c:"p"},{l:"Cancel",v:0}]);if(!o||!o.v)return;
const b={name:$("scn").value.trim(),kind:$("sck").value,url:$("scu").value.trim(),apikey:$("sca").value,username:$("scs").value,password:$("scp").value,category:x.category||""};
const r=await run(()=>api(id?"downloadclient/"+id:"downloadclient",{method:id?"PUT":"POST",body:b}));if(r){toast((r.ok?"✓ ":"✗ ")+(r.message||"Saved"));se()}}
const scTest=id=>run(()=>api("downloadclient/"+id+"/test",{method:"POST"}).then(r=>toast((r.ok?"✓ ":"✗ ")+r.message)));
const scSetup=id=>run(()=>api("downloadclient/"+id+"/setup",{method:"POST"}).then(r=>toast(r.message||(r.ok===false?"Setup failed":"Folders set up"))));
async function scDel(id){if(!await askOk("Remove this download client?","Remove"))return;await run(()=>api("downloadclient/"+id,{method:"DELETE"}));se()}
/* reader devices */
async function devBody(){const d=await api("device"),base=(SET.remote||SET.local||"").replace(/\/$/,"");window.__dv=d;return`<div class="card" style="max-width:760px"><h3>Reader devices (OPDS / Kindle)</h3><p style="font-size:12px;color:var(--m);line-height:1.5">Create one key per reader app. OPDS catalog: <b>${esc(base)}/opds?apikey=KEY</b> · Kindle browser: <b>${esc(base)}/kindle?apikey=KEY</b></p>${d.map(x=>`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(x.name)}</b><div style="font-size:12px;color:var(--m);word-break:break-all">${esc(base)}/opds?apikey=${esc(x.key)}<br>last used ${esc(x.last_used||"never")}</div></div><span class="x"><button class="btn" style="padding:3px 10px" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(base)}/opds?apikey=${esc(x.key)}').then(()=>toast('Copied'))">Copy</button> <button class="btn d" style="padding:3px 10px" onclick="devDel(${x.id})">✕</button></span></div>`).join("")||"<span style='color:var(--m)'>No devices.</span>"}<button class="btn p" style="margin-top:12px" onclick="devAdd()">+ New key</button></div>`}
async function devAdd(){const o=await dlg("New reader key",`<label class="k">Device name</label><input class="f" id="dvn" placeholder="Kindle, Moon+ Reader…">`,[{l:"Create",v:1,c:"p"},{l:"Cancel",v:0}]);if(!o||!o.v)return;await run(()=>api("device",{body:{name:$("dvn").value.trim()||"Device"}}));se()}
async function devDel(id){if(!await askOk("Remove this reader key? The app using it will lose access.","Remove"))return;await run(()=>api("device/"+id,{method:"DELETE"}));se()}
/* system */
async function sysBody(){const [h,inf,bk,lg,dup]=await Promise.all([api("health").catch(()=>[]),api("system/info").catch(()=>({disks:[]})),api("system/backup").catch(()=>[]),api("log").catch(()=>[]),api("duplicates").catch(()=>[])]);
return`<div class="two"><div class="card"><h3>Health</h3>${h.map(x=>`<div class="row" style="align-items:flex-start;font-size:13px"><span class="tag ${x.ok?"g":"o"}">${x.ok?"OK":"Check"}</span><div style="flex:1;min-width:0"><b>${esc(x.name)}</b><div style="color:var(--m);word-break:break-word">${esc(x.message)}</div></div></div>`).join("")}</div>
<div class="card"><h3>Maintenance</h3><div class="ab" style="display:flex;gap:8px;flex-wrap:wrap">${bt("Scan library","bkScan()")}${bt("Refresh metadata","bkMeta()")}${bt("Check downloads","bkCheck()")}${bt("Create backup","bkBackup()")}</div><div style="font-size:12px;color:var(--m);margin:10px 0 4px">Bookarr ${esc(inf.version||"")} · up ${esc(inf.uptime||"")}</div>${(inf.disks||[]).map(d=>`<div style="font-size:12px;color:var(--m)">${esc(d.name)}: ${fB(d.free)} free of ${fB(d.total)}</div>`).join("")}<h3 style="margin-top:14px">Backups</h3>${bk.map(b=>`<div class="row" style="font-size:13px"><span style="flex:1">${esc(b.name)}</span><span class="x">${fB(b.size)} · <a href="${SB}/api/v1/system/backup/${encodeURIComponent(b.name)}" style="color:var(--v2)">download</a></span></div>`).join("")||"<span style='color:var(--m);font-size:13px'>No backups yet (weekly automatic).</span>"}</div>
<div class="card"><h3>Duplicates</h3>${dup.length?dup.map(g=>`<div class="row" style="flex-direction:column;align-items:stretch;font-size:12px"><b>${esc(g[0].title)}</b>${g.map(i=>`<div style="color:var(--m);cursor:pointer;word-break:break-all" onclick="idet(${i.id})">${esc(i.path||"")}</div>`).join("")}</div>`).join(""):"<span style='color:var(--m)'>No duplicates found.</span>"}</div></div>
<div class="card" style="margin-top:14px"><h3>Log</h3><div style="max-height:360px;overflow:auto;font-size:12px">${lg.slice(0,150).map(x=>`<div class="row" style="align-items:flex-start;gap:8px"><span class="tag ${/ERROR|CRIT/.test(x.level)?"r":/WARN/.test(x.level)?"o":""}" style="font-size:10px">${esc(x.level)}</span><span style="flex:1;word-break:break-word">${esc(x.message)}</span><span class="x">${esc(String(x.time).slice(11,19))}</span></div>`).join("")}</div></div>`}
const bkBackup=()=>run(()=>api("system/backup",{method:"POST"}).then(r=>{toast("Backup created: "+r.name);if(page=="se")se()}));
const PG={ov,lb,ad,wa,ac,se};
$("q").oninput=e=>{LB.q=e.target.value;if(page!="lb")go("lb").then(()=>$("q").focus());else lbLive()};
/* ===== v10: this app's icon in the sidebar and browser tab ===== */
function appIcon(){const im=new Image();im.onload=()=>{const l=document.querySelector(".br .logo");if(l){l.innerHTML="";l.classList.add("hasimg");l.style.background="none";l.style.boxShadow="none";im.style.cssText="width:100%;height:100%;object-fit:contain;border-radius:8px";l.appendChild(im)}let f=document.querySelector("link[rel~=icon]");if(!f){f=document.createElement("link");f.rel="icon";document.head.appendChild(f)}f.href=im.src};im.src="/apps/bookarr.svg"}
appIcon();
boot();

</script></body></html>
